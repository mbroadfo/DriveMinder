<title>DriveMinder Report</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#eaeef2; --border:#dbe1e8;
  --text:#1a212b; --text-dim:#5b6675; --text-faint:#8b96a3;
  --accent:#1e6f77; --accent-soft:#dbebea;
  --good:#2f8f5b; --good-soft:#e3f3ea;
  --warn:#b8791f; --warn-soft:#faf0dd;
  --critical:#c0453a; --critical-soft:#fbe6e3;
  --cat-personal:#3f7cac; --cat-docs:#4f9d69; --cat-backup:#c96f3f;
  --cat-appsos:#7d6bb0; --cat-games:#d9a441; --cat-cache:#b23b3b;
  --cat-downloads:#5aa0c7; --cat-other:#9aa4b2;
  --shadow: 0 1px 2px rgba(20,30,40,.06), 0 8px 24px -12px rgba(20,30,40,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161c; --surface:#1a2027; --surface-2:#212932; --border:#2c353f;
    --text:#e8edf2; --text-dim:#a2adba; --text-faint:#71808f;
    --accent:#4fb3ae; --accent-soft:#1d3634;
    --good:#4cb87d; --good-soft:#1a3327; --warn:#e0a642; --warn-soft:#3a2f18;
    --critical:#e2685c; --critical-soft:#3a2321;
    --cat-personal:#5a97c4; --cat-docs:#69b884; --cat-backup:#d98a5c;
    --cat-appsos:#9987cf; --cat-games:#e2b95e; --cat-cache:#d15b50;
    --cat-downloads:#7fc0e8; --cat-other:#8b96a3;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1a2027; --surface-2:#212932; --border:#2c353f;
  --text:#e8edf2; --text-dim:#a2adba; --text-faint:#71808f;
  --accent:#4fb3ae; --accent-soft:#1d3634;
  --good:#4cb87d; --good-soft:#1a3327; --warn:#e0a642; --warn-soft:#3a2f18;
  --critical:#e2685c; --critical-soft:#3a2321;
  --cat-personal:#5a97c4; --cat-docs:#69b884; --cat-backup:#d98a5c;
  --cat-appsos:#9987cf; --cat-games:#e2b95e; --cat-cache:#d15b50;
  --cat-downloads:#7fc0e8; --cat-other:#8b96a3;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--text); font-family:'Source Sans 3',system-ui,sans-serif; padding:0 16px; padding-block:28px 60px; font-size:15px; line-height:1.5;}
.wrap{max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:34px;}
h1,h2,h3{font-family:'Big Shoulders Display',system-ui,sans-serif; margin:0; text-wrap:balance;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
header{display:flex; flex-direction:column; gap:6px;}
header h1{font-size:clamp(28px,5vw,38px); font-weight:800;}
#liveIndicator .badge{vertical-align:middle; margin-left:8px; font-size:13px; padding:4px 11px;}
header p{color:var(--text-dim); max-width:65ch; margin:0;}
.stat-strip{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;}
.stat-pill{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 14px; display:flex; flex-direction:column; gap:2px; min-width:130px;}
.stat-pill .n{font-family:'IBM Plex Mono'; font-size:19px; font-weight:600;}
.stat-pill .l{font-size:11.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.5px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.section-head h2{font-size:24px; font-weight:700;}
.section-head .sub{color:var(--text-faint); font-size:13px;}
.drive-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px;}
.drive-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;}
.drive-card .dtop{display:flex; align-items:center; justify-content:space-between;}
.drive-card .dletter{font-family:'Big Shoulders Display'; font-weight:800; font-size:26px;}
.drive-card .dname{color:var(--text-dim); font-size:12.5px; text-transform:uppercase; letter-spacing:.6px;}
.badge{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; padding:3px 8px; border-radius:20px;}
.badge.crit{background:var(--critical-soft); color:var(--critical);}
.badge.warn{background:var(--warn-soft); color:var(--warn);}
.badge.good{background:var(--good-soft); color:var(--good);}
.cap-bar{height:10px; border-radius:6px; background:var(--surface-2); overflow:hidden;}
.cap-fill{height:100%; background:var(--accent); border-radius:6px 0 0 6px;}
.drive-card .figs{display:flex; justify-content:space-between; font-family:'IBM Plex Mono'; font-size:12.5px; color:var(--text-dim);}
.drive-card .figs b{color:var(--text); font-weight:600;}
.cat-bar{height:16px; border-radius:5px; overflow:hidden; display:flex; border:1px solid var(--border);}
.cat-bar span{height:100%;}
.legend{display:flex; flex-wrap:wrap; gap:10px 16px; font-size:12.5px; color:var(--text-dim);}
.legend .li{display:flex; align-items:center; gap:6px;}
.legend .sw{width:10px; height:10px; border-radius:3px; display:inline-block;}
.clean-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px;}
.clean-card{background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:12px; padding:16px 18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px;}
.clean-card.tag-safe{border-left-color:var(--good);}
.clean-card.tag-review{border-left-color:var(--warn);}
.clean-card.tag-caution{border-left-color:var(--critical);}
.clean-card .chead{display:flex; align-items:start; justify-content:space-between; gap:10px;}
.clean-card h3{font-size:17px; font-weight:700; line-height:1.25;}
.clean-card .amt{font-family:'IBM Plex Mono'; font-weight:600; font-size:15px; color:var(--accent); white-space:nowrap;}
.clean-card p{margin:0; color:var(--text-dim); font-size:13.6px;}
.clean-card .paths{display:flex; flex-direction:column; gap:3px; margin-top:2px;}
.clean-card .paths code{font-family:'IBM Plex Mono'; font-size:11.5px; background:var(--surface-2); padding:3px 7px; border-radius:5px; color:var(--text-dim); overflow-wrap:anywhere;}
.tabbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; border-bottom:1px solid var(--border);}
.tabbtn{font-family:'IBM Plex Mono'; font-weight:600; font-size:13.5px; padding:9px 16px; border-radius:8px 8px 0 0; background:none; border:none; color:var(--text-faint); cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; margin-bottom:-1px;}
.tabbtn:hover{color:var(--text);}
.tabbtn.active{color:var(--accent); border-bottom-color:var(--accent); background:var(--surface-2);}
.tabpanel{display:none;}
.tabpanel.active{display:block;}
.detail-grid{display:grid; grid-template-columns:1.1fr 1fr; gap:20px; margin-top:18px;}
@media (max-width:720px){.detail-grid{grid-template-columns:1fr;}}
.panel-box{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; box-shadow:var(--shadow);}
.panel-box h4{margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-faint); font-weight:700;}
.barrow{display:grid; grid-template-columns:1fr auto; gap:2px 10px; align-items:center; margin-bottom:9px;}
.barrow .lbl{font-size:12.6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.barrow .val{font-family:'IBM Plex Mono'; font-size:12px; color:var(--text-dim); white-space:nowrap;}
.barrow .track{grid-column:1/3; height:7px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
.barrow .track i{display:block; height:100%; background:var(--accent); border-radius:4px;}
table{width:100%; border-collapse:collapse; font-size:12.4px;}
table th{text-align:left; color:var(--text-faint); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.4px; padding:0 8px 8px 0; border-bottom:1px solid var(--border);}
table td{padding:7px 8px 7px 0; border-bottom:1px solid var(--border); vertical-align:top;}
table td.p{overflow-wrap:anywhere; color:var(--text-dim);}
table td.s{font-family:'IBM Plex Mono'; white-space:nowrap; text-align:right;}
.tablewrap{overflow-x:auto;}
.note{font-size:12.5px; color:var(--text-faint); border-top:1px dashed var(--border); padding-top:12px; margin-top:14px;}
footer{color:var(--text-faint); font-size:12px; border-top:1px solid var(--border); padding-top:18px;}
.empty{color:var(--text-faint); font-size:13px; font-style:italic;}
.tm-box{margin-bottom:20px;}
.tm-head{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:10px;}
.tm-crumbs{display:flex; align-items:center; flex-wrap:wrap; gap:0; font-family:'IBM Plex Mono'; font-size:12px;}
.tm-crumb{background:none; border:none; color:var(--accent); cursor:pointer; padding:3px 5px; border-radius:4px; font-family:inherit; font-size:inherit;}
.tm-crumb:hover{background:var(--surface-2);}
.tm-crumb:last-child{color:var(--text); font-weight:600; cursor:default;}
.tm-sep{color:var(--text-faint); padding:0 2px;}
.tm-svg-wrap svg{width:100%; height:auto; display:block; background:var(--surface-2); border-radius:8px;}
.tm-info{margin-top:10px; font-size:12.8px; color:var(--text-dim); min-height:18px; overflow-wrap:anywhere;}
.tm-info b{color:var(--text);}
.tm-ext-legend{margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);}
</style>

<div class="wrap">
  <header>
    <h1>DriveMinder <span id="liveIndicator"></span></h1>
    <p id="subhead">A byte-level survey of this PC's drives — what's OS, personal data, backup, or just sitting there.</p>
    <div class="stat-strip" id="statStrip"></div>
  </header>

  <section>
    <div class="section-head"><h2>Drive capacity</h2><span class="sub">Windows-reported used / free</span></div>
    <div class="drive-grid" id="driveGrid" style="margin-top:14px;"></div>
    <div class="legend" id="catLegend" style="margin-top:16px;"></div>
  </section>

  <section>
    <div class="section-head"><h2>Cleanup opportunities</h2><span class="sub">Generated from this scan — nothing was deleted</span></div>
    <div class="clean-grid" id="cleanGrid" style="margin-top:14px;"></div>
  </section>

  <section>
    <div class="section-head"><h2>Per-drive detail</h2><span class="sub">Largest folders, file types, individual files</span></div>
    <div class="tabbar" id="tabbar" style="margin-top:14px;"></div>
    <div id="tabpanels"></div>
  </section>

  <footer id="footerNote"></footer>
</div>

<script>
/* ============================================================
   DriveMinder dashboard renderer.
   All intelligence (categorization, cleanup-opportunity rules)
   lives here in JS so future features (duplicate detection,
   retention strategy, investigation, chat) can build on this
   one client-side layer without touching the PowerShell scanner.
   ============================================================ */
const PAYLOAD = /*__DRIVEMINDER_DATA_START__*/{"generatedAt":null,"machine":"(sample)","drives":[]}/*__DRIVEMINDER_DATA_END__*/;

const GiB = 1073741824;
function fmt(bytes){
  if(bytes==null) return '—';
  const gib = bytes/GiB;
  if(gib >= 1) return gib.toFixed(gib>=100?0:1)+' GB';
  return Math.max(bytes/1048576,0).toFixed(0)+' MB';
}
function pct(a,b){ return b? (a/b*100) : 0; }
function basename(p){ return p.split('\\').pop(); }

/* ---------------- generic category rules ---------------- */
const CATS = {
  personal:{label:'Personal (media/photos/video)', color:'var(--cat-personal)'},
  docs:{label:'Documents', color:'var(--cat-docs)'},
  downloads:{label:'Downloads', color:'var(--cat-downloads)'},
  backup:{label:'Backups / archives', color:'var(--cat-backup)'},
  appsos:{label:'Apps & OS', color:'var(--cat-appsos)'},
  games:{label:'Games', color:'var(--cat-games)'},
  cache:{label:'System / app caches, leftovers', color:'var(--cat-cache)'},
  other:{label:'Other / not itemized', color:'var(--cat-other)'},
};

/* File-type palette for the treemap - WinDirStat colors by extension, which
   reads much better than our 8-way category scheme at a glance (a folder
   full of .mp3 vs .jpg vs .zip actually looks different). Grouped into
   families rather than one color per extension so the legend stays short
   and the mapping is guessable rather than arbitrary. */
const EXT_FAMILIES = [
  {key:'audio',   label:'Audio',           color:'#3f7cac', test:/^\.(mp3|m4a|m4b|m4p|flac|wav|aac|wma|ogg|aa|aax|mid|midi)$/},
  {key:'video',   label:'Video',           color:'#c0453a', test:/^\.(mp4|mov|avi|mkv|wmv|m4v|mpg|mpeg|insv|lrv|vob|3gp|flv|webm)$/},
  {key:'image',   label:'Images',          color:'#3fa7ac', test:/^\.(jpg|jpeg|png|heic|raw|cr2|nef|dng|tiff?|bmp|gif|webp|psd)$/},
  {key:'doc',     label:'Documents',       color:'#4f9d69', test:/^\.(pdf|docx?|xlsx?|pptx?|txt|rtf|odt|csv|md)$/},
  {key:'archive', label:'Archives/images', color:'#8a6bc9', test:/^\.(zip|rar|7z|tar|gz|tgz|iso|vhd|vhdx|vmdk)$/},
  {key:'program', label:'Programs/system', color:'#d9a441', test:/^\.(exe|msi|dll|sys|bat|cmd|ps1|msp)$/},
  {key:'game',    label:'Game/app data',   color:'#c95fa0', test:/^\.(pak|vpk|gcf|dds|blp|wem|sav|mca|dat|gro|bsp)$/},
  {key:'data',    label:'App data/logs',   color:'#8b96a3', test:/^\.(db|log|ini|xml|json|cache|qdf-backup|qdf|qel)$/},
];
const EXT_OTHER = {key:'other', label:'Other', color:'#6b7684'};
const extColorCache = new Map();
function extFamily(ext){
  if(!ext) return EXT_OTHER;
  if(extColorCache.has(ext)) return extColorCache.get(ext);
  const found = EXT_FAMILIES.find(f => f.test.test(ext)) || EXT_OTHER;
  extColorCache.set(ext, found);
  return found;
}

function categorizeFolderName(name){
  const n = (name||'').toLowerCase();
  if(/^\$windows\.~(ws|bt)$|^windows\.old$|^\$recycle\.bin$|^recycler$|^system volume information$|^temp$|cache/.test(n)) return 'cache';
  if(/steam|origin games|gog (galaxy|games)|epic games|battle\.net|riot games|ubisoft|xboxgames/.test(n)) return 'games';
  if(/^downloads$/.test(n)) return 'downloads';
  if(/^appdata$/.test(n)) return 'cache';
  if(/backup|shadowmaker/.test(n)) return 'backup';
  if(/^(windows|program files( \(x86\))?|programdata|drivers)$/.test(n)) return 'appsos';
  if(/doc|desktop|picture|photo|video|music|movie|camera|gopro|insta360|tivo|tv show|slideshow|magazine/.test(n)) return 'personal';
  return 'other';
}

/* Recursively drills into large/ambiguous folders using the Directories[]
   list (which already has every folder up to scan depth), mirroring what a
   human would do when eyeballing a treemap: expand the vague big blob. */
function buildFolderBreakdown(scan, totalBytes){
  const dirs = scan.Directories || [];
  const childrenOf = (path, depth) => dirs.filter(d => d.Depth === depth+1 && d.Path.length > path.length && d.Path.startsWith(path+'\\') && d.Path.slice(path.length+1).indexOf('\\') === -1);
  const EXPAND_THRESHOLD = totalBytes * 0.08;
  const MAX_DEPTH = 3;
  const results = [];

  function walk(node, prefix){
    const name = basename(node.Path) || node.Path;
    const cat = categorizeFolderName(name);
    const expandable = (cat === 'other' || cat === 'personal' || cat === 'docs') && node.Bytes > EXPAND_THRESHOLD && node.Depth < MAX_DEPTH;
    if(expandable){
      const kids = childrenOf(node.Path, node.Depth).sort((a,b)=>b.Bytes-a.Bytes);
      if(kids.length){
        let kidsSum = 0;
        kids.slice(0,8).forEach(k => { kidsSum += k.Bytes; walk(k, prefix+name+' › '); });
        const leftover = node.Bytes - kidsSum;
        if(leftover > totalBytes*0.005) results.push({label:prefix+name+' (other)', bytes:leftover, cat});
        return;
      }
    }
    results.push({label:prefix+name, bytes:node.Bytes, cat});
  }

  dirs.filter(d => d.Depth === 1).forEach(t => walk(t, ''));
  return results.sort((a,b)=>b.bytes-a.bytes);
}

/* ---------------- treemap: hierarchy + squarified layout + drill-down ----------------
   Builds a real parent/child tree from the flat Directories[] list (which
   already has every folder up to scan depth), then lays it out with the
   standard squarified-treemap algorithm (Bruls/Huizing/van Wijk) so tile
   aspect ratios stay readable instead of degenerating into thin slivers.
   Each child's own rect is then recursively subdivided by ITS children too
   (buildNestedTiles), so real content shows through "container" folders
   (e.g. My Music > iTunes) on the very first view instead of after several
   clicks. A tile only stops recursing - and becomes clickable to zoom in
   instead - once it runs out of children or its rect gets too small to
   subdivide legibly. */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function truncateLabel(name, widthUnits){
  const maxChars = Math.max(Math.floor(widthUnits/6.2), 3);
  return name.length > maxChars ? name.slice(0, maxChars-1)+'…' : name;
}

function buildTree(scan){
  const dirs = scan.Directories || [];
  const nodes = new Map();
  let root = null;
  dirs.forEach(d=>{
    const node = {path:d.Path, name:basename(d.Path)||d.Path, depth:d.Depth, bytes:d.Bytes, dominantExt:d.DominantExt||null, dominantExtBytes:d.DominantExtBytes||0, children:[]};
    nodes.set(d.Path, node);
    if(d.Depth === 0) root = node;
  });
  dirs.forEach(d=>{
    if(d.Depth === 0) return;
    const node = nodes.get(d.Path);
    const parentPath = d.Depth === 1 ? (root ? root.path : null) : d.Path.substring(0, d.Path.lastIndexOf('\\'));
    const parent = parentPath != null ? nodes.get(parentPath) : null;
    if(parent) parent.children.push(node);
  });
  return root;
}

/* Returns the tiles to draw for one treemap level: real child folders
   (capped, with overflow folded into a "+N more" drillable bucket) plus a
   synthetic tile for bytes that belong to this folder but aren't in any
   scanned subfolder (loose files, or content past the scan depth limit). */
function childrenWithLeftover(node, maxTiles){
  maxTiles = maxTiles || 40;
  const kids = (node.children||[]).slice().sort((a,b)=>b.bytes-a.bytes);
  const childSum = kids.reduce((s,k)=>s+k.bytes,0);
  const leftover = Math.max(node.bytes - childSum, 0);
  let items = kids;
  if(kids.length > maxTiles){
    const visible = kids.slice(0, maxTiles-1);
    const overflow = kids.slice(maxTiles-1);
    const overflowSum = overflow.reduce((s,k)=>s+k.bytes,0);
    items = visible.concat([{name:`+ ${overflow.length} more`, bytes:overflowSum, isExtra:true, children:overflow}]);
  }
  if(leftover > Math.max(node.bytes*0.003, 1)){
    items = items.concat([{name:'(files here / beyond scan depth)', bytes:leftover, isLeftover:true, children:[]}]);
  }
  return items;
}

function worstAspectRatio(row, side){
  const sum = row.reduce((s,r)=>s+r.value,0);
  const maxV = Math.max(...row.map(r=>r.value));
  const minV = Math.min(...row.map(r=>r.value));
  const s2 = sum*sum, side2 = side*side;
  return Math.max((side2*maxV)/s2, s2/(side2*minV));
}

/* Standard squarified-treemap layout. `items` need only a positive .bytes;
   returns [{item, x, y, w, h}] filling the given rectangle exactly. */
function squarify(items, x, y, w, h){
  const total = items.reduce((s,i)=>s+i.bytes,0);
  if(total <= 0 || !items.length) return [];
  const scale = (w*h)/total;
  let list = items.map(it=>({item:it, value:Math.max(it.bytes*scale, 0.0001)}));
  const rects = [];
  let rx=x, ry=y, rw=w, rh=h;

  while(list.length){
    const side = Math.min(rw, rh);
    let row = [list[0]];
    let ratio = worstAspectRatio(row, side);
    let i = 1;
    while(i < list.length){
      const testRow = row.concat([list[i]]);
      const testRatio = worstAspectRatio(testRow, side);
      if(testRatio <= ratio){ row = testRow; ratio = testRatio; i++; }
      else break;
    }
    const rowSum = row.reduce((s,r)=>s+r.value,0);
    const rowLen = rowSum / side;
    if(rw >= rh){
      let yy = ry;
      row.forEach(r=>{ const th=(r.value/rowSum)*rh; rects.push({item:r.item,x:rx,y:yy,w:rowLen,h:th}); yy+=th; });
      rx += rowLen; rw -= rowLen;
    } else {
      let xx = rx;
      row.forEach(r=>{ const tw=(r.value/rowSum)*rw; rects.push({item:r.item,x:xx,y:ry,w:tw,h:rowLen}); xx+=tw; });
      ry += rowLen; rh -= rowLen;
    }
    list = list.slice(row.length);
  }
  return rects;
}

const TREEMAP_STATE = {}; // letter -> {stack:[nodeObj,...], pathStack:[path|null,...]}
const TM_VB_W = 1000, TM_VB_H = 520;

/* Nested/cushion layout: recursively subdivides a child's own rect using
   ITS children too (and so on), so a real WinDirStat view shows colored
   file-type patches wherever content actually lives, without clicking down
   through "container" folders (e.g. My Music > iTunes) that own none of
   their bytes directly. A tile stops recursing - and becomes a single
   drawn leaf, still clickable to zoom in - once it has no children, its
   rect is too small to subdivide legibly, or the total leaf budget below
   is hit (guards against pathological fan-out on a real multi-TB drive). */
const MIN_RECURSE_AREA = 60; // viewBox units^2; ~1 unit wide at 100% CSS width
const MAX_TREEMAP_LEAVES = 3000;
function buildNestedTiles(node, x, y, w, h, out){
  const items = (out.length < MAX_TREEMAP_LEAVES) ? childrenWithLeftover(node) : [];
  if(!items.length){
    out.push({item:node, x, y, w, h});
    return;
  }
  squarify(items, x, y, w, h).forEach(r=>{
    const it = r.item;
    const canRecurse = !it.isExtra && !it.isLeftover && it.children && it.children.length
      && (r.w*r.h) >= MIN_RECURSE_AREA && out.length < MAX_TREEMAP_LEAVES;
    if(canRecurse) buildNestedTiles(it, r.x, r.y, r.w, r.h, out);
    else out.push({item:it, x:r.x, y:r.y, w:r.w, h:r.h});
  });
}

/* A live poll rebuilds the whole tree from scratch each time (fresh JSON in,
   fresh node objects out) - the OLD stack's object references point at a
   now-discarded tree, so drilling into a folder would otherwise snap back to
   the root on every single poll. This walks the previous drill-path's PATHS
   (not object refs) against the NEW tree and stops at the deepest folder
   that still resolves, so watching a folder fill in live doesn't fight the
   user's own navigation. */
function resolveTreemapStack(root, pathStack){
  const stack = [root];
  for(let i=1; i<(pathStack||[]).length; i++){
    const wantPath = pathStack[i];
    if(wantPath == null) break; // was a synthetic "+N more"/leftover tile - can't survive a refetch
    const kid = (stack[stack.length-1].children||[]).find(c => c.path === wantPath);
    if(!kid) break;
    stack.push(kid);
  }
  return stack;
}

/* Call this whenever a drive gets a FRESH tree (initial render, or a live
   poll) - as opposed to renderTreemap, which clicks/breadcrumbs call
   directly since their node objects are already current. */
function refreshTreemap(letter, root, svgId, crumbId, infoId){
  const prevPathStack = (TREEMAP_STATE[letter] && TREEMAP_STATE[letter].pathStack) || [root.path];
  const stack = resolveTreemapStack(root, prevPathStack);
  TREEMAP_STATE[letter] = { stack, pathStack: stack.map(n=>n.path) };
  renderTreemap(letter, stack[stack.length-1], svgId, crumbId, infoId);
}

function renderTreemap(letter, node, svgId, crumbId, infoId){
  const state = TREEMAP_STATE[letter];
  const container = document.getElementById(svgId);
  const crumbEl = document.getElementById(crumbId);
  const infoEl = document.getElementById(infoId);

  crumbEl.innerHTML = state.stack.map((n,i)=>
    `<button class="tm-crumb" data-idx="${i}">${i===0 ? (letter+':') : escapeHtml(n.name||basename(n.path)||'?')}</button>${i<state.stack.length-1?'<span class="tm-sep">›</span>':''}`
  ).join('');
  crumbEl.querySelectorAll('.tm-crumb').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = +btn.dataset.idx;
      if(idx === state.stack.length-1) return;
      state.stack = state.stack.slice(0, idx+1);
      state.pathStack = state.pathStack.slice(0, idx+1);
      renderTreemap(letter, state.stack[state.stack.length-1], svgId, crumbId, infoId);
    };
  });

  const items = childrenWithLeftover(node);
  if(!items.length){
    container.innerHTML = '<div class="empty">No deeper folders scanned here (scan depth limit, or nothing but loose files).</div>';
    infoEl.innerHTML = `<b>${escapeHtml(node.name || (letter+':'))}</b> — ${fmt(node.bytes)}`;
    return;
  }

  const pad = 1;
  const rects = [];
  buildNestedTiles(node, pad, pad, TM_VB_W-pad*2, TM_VB_H-pad*2, rects);
  const glossId = 'tmGloss-'+letter;

  /* Tile color: dominant file type when this folder has direct files of its
     own (WinDirStat-style - most of the visual "read" comes from this),
     falling back to the folder-name category for pure container folders
     (e.g. "Users", "Program Files") that own no files directly. */
  function tileFamily(it){
    if(it.isLeftover || it.isExtra) return EXT_OTHER;
    // Trust the dominant extension only when it's a real chunk of this
    // folder, not a stray metadata file amid mostly-subfolder content (e.g.
    // "My Music" showing as Documents because of one lone .xls sitting
    // directly in it while the actual music lives in subfolders below).
    if(it.dominantExt && it.dominantExtBytes > it.bytes * 0.15) return extFamily(it.dominantExt);
    const cat = categorizeFolderName(it.name);
    return {label: CATS[cat].label, color: CATS[cat].color}; // CATS colors are var(--token) refs, valid directly as an SVG fill
  }

  const svgParts = rects.map((r,idx)=>{
    const it = r.item;
    const fam = tileFamily(it);
    // Fixed 0.8-unit gap would swallow the smaller leaves nested recursion
    // can now produce, so it scales down with tile size instead.
    const gap = Math.min(0.8, r.w*0.12, r.h*0.12);
    const rw = Math.max(r.w-gap,0), rh = Math.max(r.h-gap,0);
    const showLabel = rw>55 && rh>22;
    const drillable = (it.children && it.children.length) ? true : false;
    return `
      <g class="tm-tile" data-idx="${idx}" style="cursor:${drillable?'pointer':'default'}">
        <rect x="${r.x.toFixed(1)}" y="${r.y.toFixed(1)}" width="${rw.toFixed(1)}" height="${rh.toFixed(1)}" fill="${fam.color}" fill-opacity="${it.isLeftover?0.45:1}"></rect>
        <rect x="${r.x.toFixed(1)}" y="${r.y.toFixed(1)}" width="${rw.toFixed(1)}" height="${rh.toFixed(1)}" fill="url(#${glossId})" stroke="rgba(0,0,0,.35)" stroke-width="0.6"></rect>
        ${showLabel ? `<text x="${(r.x+5).toFixed(1)}" y="${(r.y+15).toFixed(1)}" font-size="11" fill="#fff" stroke="rgba(0,0,0,.55)" stroke-width="2.5" paint-order="stroke" style="pointer-events:none;font-family:'Source Sans 3',sans-serif;font-weight:600;">${escapeHtml(truncateLabel(it.name, rw))}</text><text x="${(r.x+5).toFixed(1)}" y="${(r.y+28).toFixed(1)}" font-size="10" fill="#fff" stroke="rgba(0,0,0,.55)" stroke-width="2.5" paint-order="stroke" fill-opacity="0.92" style="pointer-events:none;font-family:'IBM Plex Mono',monospace;">${fmt(it.bytes)}</text>` : ''}
        <title>${escapeHtml(it.name)} — ${fmt(it.bytes)} (${pct(it.bytes,node.bytes).toFixed(1)}% of ${escapeHtml(node.name||letter+':')}) — ${escapeHtml(fam.label)}</title>
      </g>`;
  }).join('');

  container.innerHTML = `<svg viewBox="0 0 ${TM_VB_W} ${TM_VB_H}">
    <defs>
      <linearGradient id="${glossId}" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
        <stop offset="18%" stop-color="#ffffff" stop-opacity="0.16"/>
        <stop offset="48%" stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="75%" stop-color="#000000" stop-opacity="0.08"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.32"/>
      </linearGradient>
    </defs>
    ${svgParts}
  </svg>`;

  container.querySelectorAll('.tm-tile').forEach((el, idx)=>{
    const it = rects[idx].item;
    el.addEventListener('mouseenter', ()=>{
      infoEl.innerHTML = `<b>${escapeHtml(it.name)}</b> — ${fmt(it.bytes)} <span style="color:var(--text-faint)">(${pct(it.bytes,node.bytes).toFixed(1)}% of ${escapeHtml(node.name||letter+':')})</span>${it.path?` <span class="mono" style="font-size:11px;">${escapeHtml(it.path)}</span>`:''}`;
    });
    el.addEventListener('click', ()=>{
      if(it.children && it.children.length){
        const target = it.isExtra ? {name:it.name, path:null, bytes:it.bytes, children:it.children} : it;
        state.stack.push(target);
        state.pathStack.push(target.path != null ? target.path : null);
        renderTreemap(letter, target, svgId, crumbId, infoId);
      }
    });
  });

  infoEl.innerHTML = `<b>${escapeHtml(node.name || (letter+':'))}</b> — ${fmt(node.bytes)} total`;
}

/* ---------------- opportunity detectors ---------------- */
function detectOpportunities(drives){
  const cards = [];

  // 1. Low free space
  drives.forEach(d=>{
    if(d.totalBytes){
      const freePct = pct(d.freeBytes, d.totalBytes);
      if(freePct < 15){
        cards.push({tag: freePct<8?'caution':'review', title:`${d.letter}: is running low on space`, amt: fmt(d.freeBytes)+' free',
          drives:d.letter+':', text:`Only ${freePct.toFixed(1)}% free (${fmt(d.freeBytes)} of ${fmt(d.totalBytes)}). Worth prioritizing this drive first.`, paths:[]});
      }
    }
  });

  // 2. System/update leftovers
  drives.forEach(d=>{
    const leftovers = (d.scan.Directories||[]).filter(x=>x.Depth===1 && /^\$windows\.~(ws|bt)$|^windows\.old$/i.test(basename(x.Path)) && x.Bytes>0);
    leftovers.forEach(l=>{
      cards.push({tag:'safe', title:'Windows upgrade leftover folder', amt:fmt(l.Bytes), drives:d.letter+':',
        text:`${basename(l.Path)} is a rollback cache from a past Windows upgrade. Safe to clear via Disk Cleanup once you're confident the upgrade is stable.`,
        paths:[l.Path]});
    });
  });

  // 3. Stale large files (not touched in 2+ years, >300MB)
  const cutoff = new Date(); cutoff.setFullYear(cutoff.getFullYear()-2);
  let staleFiles = [];
  drives.forEach(d=>{
    (d.scan.TopFiles||[]).forEach(f=>{
      if(f.Bytes > 300*1048576 && new Date(f.LastWrite) < cutoff){
        staleFiles.push({drive:d.letter, path:f.Path, bytes:f.Bytes, year:new Date(f.LastWrite).getFullYear()});
      }
    });
  });
  staleFiles.sort((a,b)=>b.bytes-a.bytes);
  if(staleFiles.length){
    const top = staleFiles.slice(0,10);
    const total = staleFiles.reduce((s,f)=>s+f.bytes,0);
    cards.push({tag:'review', title:'Large files untouched for 2+ years', amt:fmt(total), drives:[...new Set(staleFiles.map(f=>f.drive+':'))].join(', '),
      text:`${staleFiles.length} file(s) over 300MB haven't been modified since before ${cutoff.getFullYear()}. Old installers, ISOs and abandoned project files tend to collect here.`,
      paths: top.map(f=>`${f.drive}: ${basename(f.path)} — ${fmt(f.bytes)} (${f.year})`)});
  }

  // 4. Confirmed duplicates: real content hashes match (Scan-Drive.ps1's
  // staged size -> partial-hash -> full-hash pipeline, files >= its
  // -MinHashBytes floor only). Grouping HashedFiles by FullHash across every
  // drive here mirrors exactly how the name+size fallback below already
  // works across drives - the only difference is the grouping key.
  const hashSeen = new Map();
  drives.forEach(d=>{
    (d.scan.HashedFiles||[]).forEach(f=>{
      if(!hashSeen.has(f.FullHash)) hashSeen.set(f.FullHash, []);
      hashSeen.get(f.FullHash).push({drive:d.letter, path:f.Path, bytes:f.Bytes});
    });
  });
  let hashGroups = [...hashSeen.values()].filter(g=>g.length>1);
  hashGroups.sort((a,b)=> (b[0].bytes*b.length) - (a[0].bytes*a.length));
  if(hashGroups.length){
    const total = hashGroups.reduce((s,g)=>s+g[0].bytes*(g.length-1),0);
    const involvedDrives = [...new Set(hashGroups.flatMap(g=>g.map(x=>x.drive)))];
    cards.push({tag:'review', title:'Confirmed duplicates (content hash matches)', amt:'~'+fmt(total)+' reclaimable',
      drives:involvedDrives.map(d=>d+':').join(', '),
      text:`${hashGroups.length} file(s) have byte-for-byte identical content elsewhere on the PC, verified by hash - not just a name+size guess. Safe to review and remove all but one copy of each.`,
      paths: hashGroups.slice(0,8).map(g=>`${basename(g[0].path)} (${fmt(g[0].bytes)}) — on ${g.map(x=>x.drive+':').join(', ')} (${g.length} copies)`)});
  }

  // 5. Possible duplicates (fallback): same filename + same size, for files
  // too small to be hash-candidates (below Scan-Drive.ps1's -MinHashBytes)
  // or not yet covered by a hash pass. Weaker signal than #4 above - kept
  // as a fallback, not replaced, since it still catches things #4 can't.
  const seen = new Map();
  drives.forEach(d=>{
    (d.scan.TopFiles||[]).forEach(f=>{
      const key = basename(f.Path).toLowerCase()+'|'+f.Bytes;
      if(!seen.has(key)) seen.set(key, []);
      seen.get(key).push({drive:d.letter, path:f.Path, bytes:f.Bytes});
    });
  });
  let dupGroups = [...seen.values()].filter(g=>g.length>1);
  dupGroups.sort((a,b)=> (b[0].bytes*b.length) - (a[0].bytes*a.length));
  if(dupGroups.length){
    const total = dupGroups.reduce((s,g)=>s+g[0].bytes*(g.length-1),0);
    const involvedDrives = [...new Set(dupGroups.flatMap(g=>g.map(x=>x.drive)))];
    cards.push({tag:'review', title:'Same filename + size appears more than once', amt:'~'+fmt(total)+' redundant',
      drives:involvedDrives.map(d=>d+':').join(', '),
      text:`${dupGroups.length} file(s) among the largest on each drive share an identical name and size elsewhere on the PC — a weaker, unverified signal than the hash-confirmed card above (name+size only, or too small to be hash-checked). Verify before deleting.`,
      paths: dupGroups.slice(0,8).map(g=>`${basename(g[0].path)} (${fmt(g[0].bytes)}) — on ${g.map(x=>x.drive+':').join(', ')}`)});
  }

  // 6. Backup-tagged volume, just for awareness
  drives.forEach(d=>{
    const bd = buildFolderBreakdown(d.scan, d.scan.TotalBytes);
    const backupBytes = bd.filter(x=>x.cat==='backup').reduce((s,x)=>s+x.bytes,0);
    if(backupBytes > 0.6*d.scan.TotalBytes && d.scan.TotalBytes > 50*GiB){
      cards.push({tag:'caution', title:`${d.letter}: is mostly a backup volume`, amt:fmt(backupBytes),
        drives:d.letter+':', text:`Over 60% of what was scanned here is tagged as backup/archive data. Before trimming anything on this drive, confirm it's not the only copy of something.`, paths:[]});
    }
  });

  // 7. Large Downloads folder
  drives.forEach(d=>{
    const dl = (d.scan.Directories||[]).find(x=>x.Depth===1 && /^downloads$/i.test(basename(x.Path)));
    if(dl && dl.Bytes > 10*GiB){
      cards.push({tag:'review', title:'Downloads folder has grown large', amt:fmt(dl.Bytes), drives:d.letter+':',
        text:`Downloads folders accumulate installers, archives and one-off files that are rarely revisited. Worth a manual sweep.`, paths:[dl.Path]});
    }
  });

  return cards;
}

/* ================= RENDER =================
   renderAll() is called once for the final static report (real data
   injected at generation time) OR repeatedly for the live scan view
   (freshly fetched from /live-data every ~1.5s). Same function either way -
   that's what keeps the live view and the finished report from drifting
   out of sync with each other. */
let activeDriveLetter = null;
let lastPayload = PAYLOAD;

function renderAll(payload){
  const drives = payload.drives || [];
  const totalCapacity = drives.reduce((s,d)=>s+(d.totalBytes||0),0);
  const totalFree = drives.reduce((s,d)=>s+(d.freeBytes||0),0);
  const totalScanned = drives.reduce((s,d)=>s+(d.scan?.TotalBytes||0),0);
  const finishedDrives = drives.filter(d => d.scan && d.scan.Done);
  const allDone = drives.length>0 && finishedDrives.length === drives.length;

  document.getElementById('subhead').textContent =
    `A byte-level survey of ${drives.length} drive(s) on ${payload.machine||'this PC'} — what's OS, personal data, backup, or just sitting there.`;
  document.getElementById('liveIndicator').innerHTML =
    (drives.length && !allDone) ? '<span class="badge warn">Scanning…</span>' : '';

  document.getElementById('statStrip').innerHTML = drives.length ? `
    <div class="stat-pill"><div class="n">${fmt(totalCapacity)}</div><div class="l">Total capacity</div></div>
    <div class="stat-pill"><div class="n">${fmt(totalCapacity-totalFree)}</div><div class="l">Used (all drives)</div></div>
    <div class="stat-pill"><div class="n">${fmt(totalFree)}</div><div class="l">Free</div></div>
    <div class="stat-pill"><div class="n">${fmt(totalScanned)}</div><div class="l">${allDone?'Bytes accounted for':'Bytes scanned so far'}</div></div>
  ` : '';

  const driveGrid = document.getElementById('driveGrid');
  driveGrid.innerHTML = '';
  if(!drives.length){
    driveGrid.innerHTML = '<div class="empty">Waiting for the first scan results… (run scripts\\Invoke-DriveCensus.ps1 if you\'re seeing this outside of a live scan)</div>';
  } else {
    drives.forEach(d=>{
      const usedBytes = (d.totalBytes||0) - (d.freeBytes||0);
      const usedPct = pct(usedBytes, d.totalBytes);
      const freePct = pct(d.freeBytes, d.totalBytes);
      const scanning = !(d.scan && d.scan.Done);
      let badge = scanning ? '<span class="badge warn">Scanning…</span>' : '';
      if(!scanning && freePct < 10) badge = '<span class="badge crit">Low space</span>';
      else if(!scanning && freePct < 20) badge = '<span class="badge warn">Watch</span>';

      const breakdown = buildFolderBreakdown(d.scan, d.scan.TotalBytes || 1);
      const catTotals = {};
      breakdown.forEach(b=>{ catTotals[b.cat] = (catTotals[b.cat]||0) + b.bytes; });
      const catBarHtml = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).map(([cat,bytes])=>{
        const w = pct(bytes, d.scan.TotalBytes || 1);
        return `<span style="width:${w}%;background:${CATS[cat].color}" title="${CATS[cat].label}: ${fmt(bytes)}"></span>`;
      }).join('');

      const card = document.createElement('div');
      card.className='drive-card';
      card.innerHTML = `
        <div class="dtop">
          <div><span class="dletter">${d.letter}:</span> <span class="dname">${d.label||''}</span></div>
          ${badge}
        </div>
        <div class="cap-bar"><div class="cap-fill" style="width:${usedPct}%"></div></div>
        <div class="figs"><span><b>${fmt(usedBytes)}</b> used</span><span>${fmt(d.freeBytes)} free</span><span>${fmt(d.totalBytes)}</span></div>
        <div class="cat-bar">${catBarHtml}</div>
      `;
      driveGrid.appendChild(card);
    });
  }

  document.getElementById('catLegend').innerHTML = Object.values(CATS).map(c=>
    `<span class="li"><span class="sw" style="background:${c.color}"></span>${c.label}</span>`
  ).join('');

  /* cleanup opportunities - only meaningful per-drive once THAT drive is
     done (TopFiles/TopExtensions/SkippedCount are empty placeholders while
     scanning, so running the heuristics early would misleadingly look like
     "all clear"). Drives that finish early still surface their findings
     right away rather than waiting on slower drives. */
  const cleanGrid = document.getElementById('cleanGrid');
  const stillScanning = drives.length - finishedDrives.length;
  if(!drives.length){
    cleanGrid.innerHTML = '<div class="empty">No scan data to analyze yet.</div>';
  } else if(!finishedDrives.length){
    cleanGrid.innerHTML = '<div class="empty">Finishing the first drive — cleanup suggestions need a completed scan.</div>';
  } else {
    const cleanups = detectOpportunities(finishedDrives);
    const order = {caution:0, review:1, safe:2};
    cleanups.sort((a,b)=>order[a.tag]-order[b.tag]);
    let html = cleanups.length ? cleanups.map(c=>`
      <div class="clean-card tag-${c.tag}">
        <div class="chead"><h3>${c.title}</h3><span class="amt">${c.amt}</span></div>
        <div><span class="badge ${c.tag==='safe'?'good':c.tag==='review'?'warn':'crit'}">${c.tag}</span> <span style="color:var(--text-faint);font-size:12px;margin-left:6px;">${c.drives}</span></div>
        <p>${c.text}</p>
        <div class="paths">${c.paths.map(p=>`<code>${p}</code>`).join('')}</div>
      </div>
    `).join('') : '<div class="empty">Nothing flagged so far.</div>';
    if(stillScanning>0){
      html += `<div class="empty" style="grid-column:1/-1;">+ ${stillScanning} drive(s) still scanning — more suggestions may appear once they finish.</div>`;
    }
    cleanGrid.innerHTML = html;
  }

  /* tabs - rebuild each pass, but keep whichever one the user had open */
  if(!drives.some(d=>d.letter===activeDriveLetter)) activeDriveLetter = drives[0] ? drives[0].letter : null;

  const tabbar = document.getElementById('tabbar');
  const panels = document.getElementById('tabpanels');
  tabbar.innerHTML = '';
  panels.innerHTML = '';

  drives.forEach(d=>{
    const isActive = d.letter === activeDriveLetter;
    const scanning = !(d.scan && d.scan.Done);
    const btn = document.createElement('button');
    btn.className = 'tabbtn'+(isActive?' active':'');
    btn.textContent = d.letter+':  '+(d.label||'')+(scanning?' •':'');
    btn.onclick = ()=>{ activeDriveLetter = d.letter; renderAll(lastPayload); };
    tabbar.appendChild(btn);

    const breakdown = buildFolderBreakdown(d.scan, d.scan.TotalBytes || 1).slice(0,12);
    const maxFolder = Math.max(1, ...breakdown.map(f=>f.bytes));
    const exts = (d.scan.TopExtensions||[]).slice(0,8);
    const maxExt = Math.max(1, ...exts.map(f=>f.Bytes));
    const files = (d.scan.TopFiles||[]).slice(0,10);

    const panel = document.createElement('div');
    panel.className = 'tabpanel'+(isActive?' active':'');
    panel.id = 'panel-'+d.letter;
    panel.innerHTML = `
      <div class="panel-box tm-box">
        <div class="tm-head">
          <h4 style="margin:0;">Treemap — click a tile to zoom in${scanning?' <span style="color:var(--text-faint);font-weight:400;">(filling in live…)</span>':''}</h4>
          <div class="tm-crumbs" id="tmCrumbs-${d.letter}"></div>
        </div>
        <div class="tm-svg-wrap" id="tmSvg-${d.letter}"></div>
        <div class="tm-info" id="tmInfo-${d.letter}"></div>
        <div class="legend tm-ext-legend">${EXT_FAMILIES.concat([EXT_OTHER]).map(f=>
          `<span class="li"><span class="sw" style="background:${f.color}"></span>${f.label}</span>`
        ).join('')}<span class="li" style="color:var(--text-faint);">+ container folders shown by category color</span></div>
      </div>
      <div class="detail-grid">
        <div class="panel-box">
          <h4>Largest folders</h4>
          ${breakdown.length ? breakdown.map(f=>`
            <div class="barrow">
              <span class="lbl" title="${f.label}">${f.label}</span><span class="val">${fmt(f.bytes)}</span>
              <div class="track"><i style="width:${pct(f.bytes,maxFolder)}%;background:${CATS[f.cat].color}"></i></div>
            </div>`).join('') : '<div class="empty">Nothing scanned here yet.</div>'}
          <h4 style="margin-top:20px;">Top file types</h4>
          ${exts.length ? exts.map(f=>`
            <div class="barrow">
              <span class="lbl" title="${f.Ext}">${f.Ext} <span style="color:var(--text-faint)">(${f.Count.toLocaleString()})</span></span><span class="val">${fmt(f.Bytes)}</span>
              <div class="track"><i style="width:${pct(f.Bytes,maxExt)}%"></i></div>
            </div>`).join('') : '<div class="empty">Available once this drive finishes.</div>'}
        </div>
        <div class="panel-box">
          <h4>Largest individual files</h4>
          <div class="tablewrap"><table>
            <thead><tr><th>Path</th><th>Size</th><th>Modified</th></tr></thead>
            <tbody>${files.length ? files.map(f=>`<tr><td class="p">${f.Path}</td><td class="s">${fmt(f.Bytes)}</td><td class="s">${new Date(f.LastWrite).getFullYear()}</td></tr>`).join('') : `<tr><td class="p empty" colspan="3">Available once this drive finishes.</td></tr>`}</tbody>
          </table></div>
          <div class="note">${!scanning ? `${d.scan.SkippedCount||0} item(s) couldn't be read (permissions or path-length limits) and are excluded from these totals.` : `Still scanning — ${(d.scan.ElapsedSec||0).toFixed(0)}s elapsed, ${fmt(d.scan.TotalBytes)} so far.`}</div>
        </div>
      </div>
    `;
    panels.appendChild(panel);

    const treeRoot = buildTree(d.scan);
    if(treeRoot){
      refreshTreemap(d.letter, treeRoot, 'tmSvg-'+d.letter, 'tmCrumbs-'+d.letter, 'tmInfo-'+d.letter);
    } else {
      document.getElementById('tmSvg-'+d.letter).innerHTML = '<div class="empty">Starting scan…</div>';
    }
  });

  document.getElementById('footerNote').textContent = drives.length
    ? `${allDone ? 'Scanned' : 'Scan started'} ${new Date(payload.generatedAt).toLocaleString()} on ${payload.machine}. Categorization and cleanup suggestions are heuristic (path/name pattern matching) — always verify before deleting anything.`
    : 'This is the DriveMinder template with no data. Run scripts\\Invoke-DriveCensus.ps1 to generate a real report.';
}

renderAll(PAYLOAD);

/* Live mode: the static final report always has real drives injected, so
   this only activates when served fresh by Invoke-DriveCensus.ps1's local
   HTTP server (whose index page keeps the template's empty sample default). */
if(!PAYLOAD.drives || !PAYLOAD.drives.length){
  const pollTimer = setInterval(async ()=>{
    try {
      const res = await fetch('/live-data', {cache:'no-store'});
      if(!res.ok) throw new Error('live-data request failed');
      const fresh = await res.json();
      lastPayload = fresh;
      renderAll(fresh);
      const allDone = fresh.drives && fresh.drives.length>0 && fresh.drives.every(d=>d.scan && d.scan.Done);
      if(allDone) clearInterval(pollTimer);
    } catch(e){
      clearInterval(pollTimer); // server gone (scan script exited) or unreachable - stop trying
    }
  }, 1500);
}
</script>
